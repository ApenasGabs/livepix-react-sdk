name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: 🧪 Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🔍 Run linting
        run: yarn lint

      - name: 🔷 Run typecheck
        run: yarn typecheck

      - name: 🧪 Run tests
        run: yarn test:ci
        env:
          LIVEPIX_CLIENT_ID: ${{ secrets.LIVEPIX_CLIENT_ID }}
          LIVEPIX_CLIENT_SECRET: ${{ secrets.LIVEPIX_CLIENT_SECRET }}

      - name: 📊 Upload test coverage
        if: matrix.node-version == 20
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: 🏗️ Build (Node ${{ matrix.node-version }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile

      - name: 🏗️ Build SDK
        run: yarn build

      - name: 🏗️ Build example app
        run: cd example && yarn install && yarn build

      - name: 📦 Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files-node-${{ matrix.node-version }}
          path: |
            dist
            !dist/**/*.map